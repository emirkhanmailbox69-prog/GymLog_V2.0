<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymLog">
<meta name="theme-color" content="#0a0a0a">
<link rel="apple-touch-icon" href="./icon-app.png">
<link rel="icon" type="image/png" href="./icon-app.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>GymLog</title>
<style>
:root{--disp:'Russo One',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:#0a0a0a;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.4}
#app{max-width:600px;margin:0 auto;height:100vh;height:100dvh;position:relative}
.app-content{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0}
.screen{display:flex;flex-direction:column;min-height:100%}
.screen.anim-fwd{animation:scrFwd .32s cubic-bezier(.22,1,.36,1)}
.screen.anim-back{animation:scrBack .32s cubic-bezier(.22,1,.36,1)}
@keyframes scrFwd{from{opacity:0;transform:translateX(56px)}to{opacity:1;transform:none}}
@keyframes scrBack{from{opacity:0;transform:translateX(-56px)}to{opacity:1;transform:none}}
.app-header{position:sticky;top:0;flex:0 0 auto;z-index:6;padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(10,10,10,.54);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-bottom:1px solid rgba(255,255,255,.08)}
.inner{flex:1 0 auto;padding:16px;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.no-pad .inner{padding-left:8px;padding-right:8px;padding-top:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
h1{font-size:32px;font-weight:400;font-family:var(--disp)}
h2{font-size:24px;font-weight:400;font-family:var(--disp)}
h3{font-size:18px;font-weight:600;margin-bottom:8px}
.date{color:#888;font-size:14px}
button{background:#2a2a2a;color:#e8e8e8;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:500;cursor:pointer;width:100%;text-align:left;transition:background .18s;position:relative;overflow:hidden}
button:active{background:#3a3a3a}
.btn-primary{background:#4a6bff;color:#fff;font-family:var(--disp);font-weight:400;letter-spacing:.5px}
.btn-primary:active{background:#3a5bef}
.btn-secondary{background:#1f2a44;color:#a8b8ff;font-family:var(--disp);font-weight:400;letter-spacing:.5px}
.btn-danger{background:#3a1f1f;color:#ff8a8a}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1}
.btn-small{padding:8px 12px;font-size:14px;width:auto}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.card{background:#161616;border-radius:16px;padding:16px;margin-bottom:12px;cursor:pointer}
.card h3{margin-bottom:4px}
.card .meta{color:#888;font-size:13px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.row.between{justify-content:space-between}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.set{width:44px;height:44px;border-radius:10px;background:#1f1f1f;border:2px solid #2a2a2a;display:flex;align-items:center;justify-content:center;font-size:14px;color:#666;cursor:pointer;font-weight:600;transition:background .25s,border-color .25s,color .25s}
.set.done{background:#2a4a2a;border-color:#4a8a4a;color:#8aff8a;animation:setpop .28s cubic-bezier(.34,1.56,.64,1)}
@keyframes setpop{0%{transform:scale(.7)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.line-row{padding:8px 0;border-bottom:1px solid #1f1f1f}
.line-row:last-child{border-bottom:none}
.timer-display{font-size:56px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px;font-family:var(--disp);width:178px;flex-shrink:0}
.timer-mode{color:#888;font-size:13px;margin-top:4px}
#timer-btn.running{animation:glowPulse 1.5s ease-in-out infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(74,107,255,0)}50%{box-shadow:0 0 22px 2px rgba(74,107,255,.55)}}
.dialog-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(4px);animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}}
.dialog{background:#1a1a1a;border-radius:16px;padding:20px;width:100%;max-width:400px;border:1px solid #333;animation:dlgIn .3s cubic-bezier(.22,1,.36,1)}
@keyframes dlgIn{from{opacity:0;transform:scale(.92) translateY(12px)}}
.dialog h3{margin-bottom:12px}
.dialog input,.dialog textarea{width:100%;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:12px;color:#e8e8e8;font-size:16px;margin-bottom:12px;font-family:inherit}
.dialog input:focus,.dialog textarea:focus{outline:none;border-color:#4a6bff}
.dialog textarea{min-height:80px;resize:vertical}
.dialog .btn-row{margin-top:8px}
.back{background:transparent;color:#a8b8ff;padding:8px 0;margin-bottom:6px;width:auto;text-align:left;font-size:16px;overflow:visible}
.back:active{background:transparent}
.empty{color:#666;text-align:center;padding:24px 0;font-size:15px}
.chip{display:inline-block;background:#1f1f1f;border-radius:20px;padding:8px 14px;font-size:14px;margin-right:8px;margin-bottom:8px;cursor:pointer;border:1px solid #2a2a2a}
.chip.active{background:#4a6bff;border-color:#4a6bff;color:#fff}
canvas{width:100%;height:240px;display:block}
.stat-big{font-size:20px;font-weight:600;margin-top:8px}
.stat-small{color:#888;font-size:14px}
.icon-btn{background:transparent;width:auto;padding:4px 8px;font-size:14px;color:#a8b8ff;overflow:visible}
.icon-btn:active{background:transparent}
.radio-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.radio{padding:10px 16px;background:#1f1f1f;border-radius:10px;cursor:pointer;border:1px solid #2a2a2a;font-size:15px}
.radio.active{background:#4a6bff;border-color:#4a6bff;color:#fff}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.switch{width:48px;height:28px;background:#2a2a2a;border-radius:14px;position:relative;cursor:pointer;transition:background .2s}
.switch.on{background:#4a6bff}
.switch::after{content:"";position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.switch.on::after{left:23px}
.medal{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;flex-shrink:0}
.medal.earned{background:#1E1E1E;color:#fff}
.medal.locked{background:#333;color:#777}
.medal.bronze{border:3px solid #CD7F32}.medal.silver{border:3px solid #C0C0C0}.medal.gold{border:3px solid #D4AF37}.medal.platinum{border:3px solid #E5E4E2}
.praise{font-size:28px;font-weight:400;font-family:var(--disp);text-align:center;margin:8px 0;background:linear-gradient(90deg,#8ab4ff,#4a6bff 45%,#f0c75e);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.footer{text-align:center;color:#555;font-size:12px;margin-top:32px}
.home-header{display:flex;align-items:center;gap:14px}
.home-header img{width:84px;height:84px;border-radius:20px;object-fit:cover;border:2px solid #2a2a2a;background:#161616;flex-shrink:0;animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.hh-title{font-size:30px;font-weight:400;font-family:var(--disp);letter-spacing:1px;line-height:1.1;background:linear-gradient(180deg,#ffffff,#8ab4ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hh-date{color:#888;font-size:13px;margin-top:2px}
.muted{color:#888;font-size:12px;margin-top:8px}
.toast{position:fixed;bottom:calc(40px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#4a6bff;color:#fff;padding:12px 20px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.ach-sum .ach-bar{height:10px;background:#1f1f1f;border-radius:6px;overflow:hidden;margin-top:12px}
.ach-bar i{display:block;height:100%;background:linear-gradient(90deg,#7a5c17,#d4af37);transition:width .6s cubic-bezier(.22,1,.36,1)}
.ach-ring{width:52px;height:52px;border-radius:50%;border:3px solid #d4af37;display:flex;align-items:center;justify-content:center;font-weight:400;font-size:14px;color:#f0c75e;font-family:var(--disp);flex-shrink:0}
.ach-sec{font-family:var(--disp);font-weight:400;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#888;margin:18px 0 10px}
.ach{display:flex;gap:12px;align-items:center;cursor:default;border-left:4px solid transparent}
.ach.r0{border-left-color:#CD7F32}.ach.r1{border-left-color:#C0C0C0}.ach.r2{border-left-color:#D4AF37}.ach.r3{border-left-color:#E5E4E2}
.ach.got .medal{box-shadow:0 0 14px rgba(212,175,55,.35)}
.ach.locked-c{opacity:.55}
.ach .info{flex:1}
.ach .nm{font-size:16px;font-weight:600}
.ach .ds{color:#888;font-size:13px;margin-top:2px}
.ach .mt{margin-top:8px}
.rchip{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px;border:1px solid}
.rchip.rc0{color:#CD7F32;border-color:#CD7F32}.rchip.rc1{color:#C0C0C0;border-color:#C0C0C0}.rchip.rc2{color:#D4AF37;border-color:#D4AF37}.rchip.rc3{color:#E5E4E2;border-color:#E5E4E2}
.ach-prog{height:6px;background:#1f1f1f;border-radius:4px;overflow:hidden;margin-top:8px}
.ach-prog i{display:block;height:100%;background:linear-gradient(90deg,#4a6bff,#8ab4ff)}
.ach-prog-lbl{font-size:11px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div id="app"></div>
<script>
window.onerror = function(msg, src, line) {
  document.getElementById('app').innerHTML = '<div style="padding:24px;color:#ff8a8a;font-size:14px;font-family:monospace">JS сдох:<br>' + msg + '<br>строка ' + line + '</div>';
};
</script>
<script>
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ localStorage.setItem(k, JSON.stringify(v)); }
};

const fmtDateLong = (d = new Date()) => {
  const s = d.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const fmtDateShort = (d = new Date()) => {
  const s = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const fmtDateTime = (ms) => {
  const d = new Date(ms);
  const s = d.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" }) + ", " +
            d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  return s.charAt(0).toUpperCase() + s.slice(1);
};
const fmtDuration = (ms) => {
  const min = Math.floor(ms / 60000);
  const h = Math.floor(min / 60);
  const m = min % 60;
  return h > 0 ? `${h} ч ${m} мин` : `${m} мин`;
};
const fmtWeight = (w) => w % 1 === 0 ? w.toString() : w.toString();
const fmtSeconds = (s) => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
const resizeSets = (sets, n) => Array.from({length: n}, (_, i) => i < sets.length ? sets[i] : false);
const setsOf = (w) => w.exercises.reduce((a, e) => a + e.lines.reduce((b, l) => b + l.done, 0), 0);
const volumeOf = (w) => w.exercises.reduce((a, e) => a + e.lines.reduce((b, l) => b + l.weight * l.reps * l.done, 0), 0);
const repsOf = (w) => w.exercises.reduce((a, e) => a + e.lines.reduce((b, l) => b + l.reps * l.done, 0), 0);
const rarityName = (r) => ["бронза", "серебро", "золото", "платина"][r] || "";

const isBenchName = (name) => {
  const n = name.toLowerCase();
  return n.includes("жим") && !n.includes("стоя") && !n.includes("сидя") && !n.includes("наклон");
};
const maxBenchWeight = (h) => Math.max(0, ...h.flatMap(w => w.exercises.filter(e => isBenchName(e.name)).flatMap(e => e.lines.map(l => l.weight))));
const maxWeightPart = (h, part) => Math.max(0, ...h.flatMap(w => w.exercises.filter(e => e.name.toLowerCase().includes(part)).flatMap(e => e.lines.map(l => l.weight))));
const bestTotal3 = (h) => Math.max(0, ...h.map(w => {
  const bench = Math.max(0, ...(w.exercises.filter(e => isBenchName(e.name)).flatMap(e => e.lines.map(l => l.weight))));
  const squat = Math.max(0, ...(w.exercises.filter(e => e.name.toLowerCase().includes("присед")).flatMap(e => e.lines.map(l => l.weight))));
  const dead = Math.max(0, ...(w.exercises.filter(e => e.name.toLowerCase().includes("станов")).flatMap(e => e.lines.map(l => l.weight))));
  return bench + squat + dead;
}));
const getWeekIndex = (millis) => {
  const d = new Date(millis);
  const day = d.getDay() === 0 ? 7 : d.getDay();
  const msPerDay = 24 * 60 * 60 * 1000;
  const mondayMs = d.getTime() - (day - 1) * msPerDay;
  return Math.floor(mondayMs / (7 * msPerDay));
};
const longestChain = (idxs) => {
  if (!idxs || idxs.size === 0) return 0;
  const sorted = Array.from(idxs).sort((a,b) => a-b);
  let best = 1, cur = 1;
  for (let i = 1; i < sorted.length; i++) {
    cur = (sorted[i] === sorted[i-1] + 1) ? cur + 1 : 1;
    best = Math.max(best, cur);
  }
  return best;
};
const weekKeysWithMin = (h, min, dayOfWeek = null) => {
  const filtered = dayOfWeek ? h.filter(w => {
    const d = new Date(w.start);
    const dw = d.getDay() === 0 ? 7 : d.getDay();
    return dw === dayOfWeek;
  }) : h;
  const grouped = filtered.reduce((acc, w) => {
    const wk = getWeekIndex(w.start);
    if (!acc[wk]) acc[wk] = 0;
    acc[wk]++;
    return acc;
  }, {});
  return new Set(Object.entries(grouped).filter(([k, v]) => v >= min).map(([k]) => parseInt(k)));
};
const fullGymAnyWeek = (h) => {
  const parts = ["присед", "станов", "подтяг", "наклон"];
  const grouped = h.reduce((acc, w) => {
    const wk = getWeekIndex(w.start);
    if (!acc[wk]) acc[wk] = [];
    acc[wk].push(w);
    return acc;
  }, {});
  return Object.values(grouped).some(ws => {
    const names = ws.flatMap(w => w.exercises.map(e => e.name.toLowerCase()));
    const bench = ws.some(w => w.exercises.some(e => isBenchName(e.name)));
    return bench && parts.every(p => names.some(n => n.includes(p)));
  });
};
const silenceStreak = (h) => {
  const chron = [...h].sort((a,b) => a.start - b.start);
  if (chron.length < 5) return false;
  for (let i = 0; i <= chron.length - 5; i++) {
    if (chron.slice(i, i+5).every(w => w.nomusic)) return true;
  }
  return false;
};
const hourOf = (millis) => new Date(millis).getHours();
const distinctNames = (h) => new Set(h.flatMap(w => w.exercises.map(e => e.name))).size;

const ACHIEVEMENTS = [
  { id: "first_hundred", name: "Первая сотня", desc: "Жим штанги лёжа ≥ 100 кг", rarity: 0, icon: "💯", hidden: false,
    check: (h, bw) => maxBenchWeight(h) >= 100, progress: (h) => [Math.floor(maxBenchWeight(h)), 100] },
  { id: "bench_bw_125", name: "Резидент жима", desc: "Жим лёжа ≥ 1.25 × собственный вес", rarity: 1, icon: "🧟", hidden: false,
    check: (h, bw) => bw > 0 && maxBenchWeight(h) >= bw * 1.25, progress: (h, bw) => bw > 0 ? [Math.floor(maxBenchWeight(h)), Math.floor(bw * 1.25)] : [0, 1] },
  { id: "bench_bw_150", name: "Скулы Императора", desc: "Жим лёжа ≥ 1.5 × собственный вес", rarity: 2, icon: "💀", hidden: false,
    check: (h, bw) => bw > 0 && maxBenchWeight(h) >= bw * 1.5, progress: (h, bw) => bw > 0 ? [Math.floor(maxBenchWeight(h)), Math.floor(bw * 1.5)] : [0, 1] },
  { id: "deadlift_bw_200", name: "Тиран лифта", desc: "Становая ≥ 2 × собственный вес", rarity: 1, icon: "🦖", hidden: false,
    check: (h, bw) => bw > 0 && maxWeightPart(h, "станов") >= bw * 2.0, progress: (h, bw) => bw > 0 ? [Math.floor(maxWeightPart(h, "станов")), Math.floor(bw * 2)] : [0, 1] },
  { id: "deadlift_bw_250", name: "Град-Молот", desc: "Становая ≥ 2.5 × собственный вес", rarity: 2, icon: "🔨", hidden: false,
    check: (h, bw) => bw > 0 && maxWeightPart(h, "станов") >= bw * 2.5, progress: (h, bw) => bw > 0 ? [Math.floor(maxWeightPart(h, "станов")), Math.floor(bw * 2.5)] : [0, 1] },
  { id: "squat_bw_150", name: "Ноги? Не слышал", desc: "Присед ≥ 1.5 × собственный вес", rarity: 0, icon: "🦵", hidden: false,
    check: (h, bw) => bw > 0 && maxWeightPart(h, "присед") >= bw * 1.5, progress: (h, bw) => bw > 0 ? [Math.floor(maxWeightPart(h, "присед")), Math.floor(bw * 1.5)] : [0, 1] },
  { id: "squat_bw_200", name: "Полный Гилель", desc: "Присед ≥ 2 × собственный вес", rarity: 2, icon: "🤖", hidden: false,
    check: (h, bw) => bw > 0 && maxWeightPart(h, "присед") >= bw * 2.0, progress: (h, bw) => bw > 0 ? [Math.floor(maxWeightPart(h, "присед")), Math.floor(bw * 2)] : [0, 1] },
  { id: "total_1000", name: "Тысячник", desc: "Жим + присед + становая ≥ 1000 кг в одной тренировке", rarity: 2, icon: "🔢", hidden: false,
    check: (h) => bestTotal3(h) >= 1000, progress: (h) => [Math.floor(bestTotal3(h)), 1000] },
  { id: "total_1500", name: "Полуторатысячник", desc: "Жим + присед + становая ≥ 1500 кг в одной тренировке", rarity: 3, icon: "⭐", hidden: false,
    check: (h) => bestTotal3(h) >= 1500, progress: (h) => [Math.floor(bestTotal3(h)), 1500] },
  { id: "first_workout", name: "Первый поход в зал", desc: "Первая записанная тренировка", rarity: 0, icon: "🚪", hidden: false,
    check: (h) => h.length > 0, progress: (h) => [h.length, 1] },
  { id: "week_power", name: "Неделя силы", desc: "3 тренировки за одну календарную неделю", rarity: 0, icon: "📅", hidden: false,
    check: (h) => weekKeysWithMin(h, 3).size > 0, progress: (h) => [Math.max(...Object.values(h.reduce((a,w)=>{const k=getWeekIndex(w.start);a[k]=(a[k]||0)+1;return a},{}))), 3] },
  { id: "iron_month", name: "Железный месяц", desc: "20 тренировок за календарный месяц", rarity: 1, icon: "🛡", hidden: false,
    check: (h) => Object.values(h.reduce((a,w)=>{const d=new Date(w.start);const k=d.getFullYear()*12+d.getMonth();a[k]=(a[k]||0)+1;return a},{})).some(v=>v>=20),
    progress: (h) => [Math.max(...Object.values(h.reduce((a,w)=>{const d=new Date(w.start);const k=d.getFullYear()*12+d.getMonth();a[k]=(a[k]||0)+1;return a},{}))), 20] },
  { id: "unbreakable", name: "Несгибаемый", desc: "4 недели подряд, в каждой ≥ 3 тренировок", rarity: 1, icon: "🔩", hidden: false,
    check: (h) => longestChain(weekKeysWithMin(h, 3)) >= 4, progress: (h) => [longestChain(weekKeysWithMin(h, 3)), 4] },
  { id: "immortal", name: "Бессмертный", desc: "52 недели подряд без пустой недели", rarity: 2, icon: "🏛", hidden: false,

const evaluateNew = (history, bw, earnedSet) => {
  const out = [];
  for (const d of ACHIEVEMENTS) {
    if (!earnedSet.has(d.id) && d.check(history, bw, earnedSet)) {
      earnedSet.add(d.id);
      out.push(d);
    }
  }
  return out;
};

{

let tickInterval = null;

const updateTimerUI = () => {
  const el = document.getElementById('timer-val');
  const btn = document.getElementById('timer-btn');
  if (!el) return;
  const now = Date.now();
  let currentMs = state.timerAnchorMs;
  if (state.timerRunning) {
    const delta = now - state.timerAnchorTime;
    if (state.timerMode === "COUNTDOWN") {
      currentMs = Math.max(0, state.timerAnchorMs - delta);
      if (currentMs <= 0) {
        state.timerRunning = false;
        state.timerAnchorMs = 0;
        stopTicking();
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    } else {
      currentMs = state.timerAnchorMs + delta;
    }
  }
  el.textContent = fmtSeconds(Math.floor(currentMs / 1000));
  if (btn) {
    btn.textContent = state.timerRunning ? "Пауза" : "Старт";
    btn.classList.toggle('running', state.timerRunning);
  }
};

const startTicking = () => {
  if (tickInterval) return;
  updateTimerUI();
  tickInterval = setInterval(updateTimerUI, 100);
};

const stopTicking = () => {
  if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
};

window.toggleTimer = () => {
  if (state.timerRunning) {
    const now = Date.now();
    const delta = now - state.timerAnchorTime;
    state.timerAnchorMs = state.timerMode === "COUNTDOWN"
      ? Math.max(0, state.timerAnchorMs - delta)
      : state.timerAnchorMs + delta;
    state.timerRunning = false;
    stopTicking();
  } else {
    state.timerAnchorTime = Date.now();
    if (state.timerMode === "COUNTDOWN" && state.timerAnchorMs <= 0) {
      state.timerAnchorMs = state.presetSeconds * 1000;
    }
    state.timerRunning = true;
    startTicking();
  }
  updateTimerUI();
};

window.resetTimerVisual = () => {
  state.timerRunning = false;
  stopTicking();
  state.timerAnchorMs = state.timerMode === "COUNTDOWN" ? state.presetSeconds * 1000 : 0;
  updateTimerUI();
};

const startTimerFresh = () => {
  state.timerAnchorTime = Date.now();
  state.timerAnchorMs = state.timerMode === "COUNTDOWN" ? state.presetSeconds * 1000 : 0;
  state.timerRunning = true;
  startTicking();
};

const save = () => {
  LS.set("history", state.history);
  LS.set("drafts", state.drafts);
  LS.set("exerciseBase", state.exerciseBase);
  LS.set("timerMode", state.timerMode);
  LS.set("autoStart", state.autoStart);
  LS.set("presetSeconds", state.presetSeconds);
  LS.set("bodyWeight", state.bodyWeightText);
  const achObj = {};
  state.earnedAch.forEach(id => achObj[id] = Date.now());
   LS.set("earnedAch", achObj);
  if (!state.editorMode && state.active) {
   state.active = { start: state.active.start, exercises: state.exercises, bulkan: state.flagBulkan, nomusic: state.flagNomusic };
   LS.set("active", state.active);
  }
  cloudQueue();
};

window.exportData = () => {
  const data = {
    history: state.history,
    drafts: state.drafts,
    exerciseBase: state.exerciseBase,
    earnedAch: Array.from(state.earnedAch),
    bodyWeight: state.bodyWeightText,
    timerMode: state.timerMode,
    autoStart: state.autoStart,
    presetSeconds: state.presetSeconds,
    exportDate: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gymlog-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
};

window.importData = (event) => {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.history) state.history = data.history;
      if (data.drafts) state.drafts = data.drafts;
      if (data.exerciseBase) state.exerciseBase = data.exerciseBase;
      if (data.earnedAch) state.earnedAch = new Set(data.earnedAch);
      if (data.bodyWeight !== undefined) state.bodyWeightText = data.bodyWeight;
      if (data.timerMode) state.timerMode = data.timerMode;
      if (data.autoStart !== undefined) state.autoStart = data.autoStart;
      if (data.presetSeconds) state.presetSeconds = data.presetSeconds;
      save();
      toast('Данные восстановлены!');
      render();
    } catch (err) {
      toast('Ошибка импорта: ' + err.message);
    }
  };
  reader.readAsText(file);
};

};

      },

        render();
      },

    render();
  } else {
    state.dialog = {
      type: "unsaved",
      onSave: () => { state.dialog = { type: "draftName", initial: "Тренировка " + fmtDateShort(), onConfirm: saveDraftAndHome }; render(); },

};

const continueActive = () => {
  const saved = LS.get("active", null) || state.active;
  if (!saved) return;
  state.active = saved;
  state.exercises = saved.exercises;
  state.flagBulkan = saved.bulkan || false;
  state.flagNomusic = saved.nomusic || false;
  state.editorMode = false; state.sourceDraftId = -1;
  resetTimerVisual(); state.screen = "WORKOUT"; render();
};

const backAction = () => {
  if (state.screen === "WORKOUT") state.editorMode ? editorBack() : activeBack();
  else if (state.screen === "SUMMARY" || state.screen === "STATS") { state.screen = state.summaryReturn; render(); }
  else { state.screen = "HOME"; render(); }
};

const toggleSet = (ei, li, si, done) => {
  state.exercises = state.exercises.map((ex, i) => {
    if (i !== ei) return ex;
    return { ...ex, lines: ex.lines.map((l, j) => {
      if (j !== li) return l;
      return { ...l, sets: l.sets.map((s, k) => k === si ? done : s) };
    })};
  });
  if (done && state.autoStart) startTimerFresh();
  save(); render();
};

const addLine = (ei) => {
  state.exercises = state.exercises.map((ex, i) => {
    if (i !== ei) return ex;
    const last = ex.lines[ex.lines.length - 1];
    return { ...ex, lines: [...ex.lines, { weight: last?.weight || 0, reps: last?.reps || 5, sets: [false], note: "" }] };
  });
  save(); render();
};

const finishWorkout = () => {
  const savedExercises = state.exercises.map(ex => {
    const lines = ex.lines.map(l => ({ weight: l.weight, reps: l.reps, done: l.sets.filter(Boolean).length, note: l.note })).filter(l => l.done > 0);
    return lines.length ? { name: ex.name, lines } : null;
  }).filter(Boolean);
  if (!savedExercises.length) { toast("Не отмечено ни одного подхода"); return; }
  const sw = { start: state.active.start, end: Date.now(), exercises: savedExercises, bulkan: state.flagBulkan, nomusic: state.flagNomusic };
  state.history = [sw, ...state.history];
  const bw = parseFloat(state.bodyWeightText.replace(",",".")) || 0;
  const newAch = evaluateNew(state.history, bw, state.earnedAch);
  if (newAch.length > 0) {
    const obj = LS.get("earnedAch", {});
    newAch.forEach(a => obj[a.id] = Date.now());
    LS.set("earnedAch", obj);
  }
  state.active = null; LS.set("active", null);
  state.exercises = []; state.flagBulkan = false; state.flagNomusic = false;
  resetTimerVisual();
  state.summaryWorkout = sw;
  state.summaryPraise = ["КРАСАВЧИК ЖИЕСЬ", "МАШИНА", "ЧО ЗА ЛЕВ", "ГРЁБАНАЯ ЛЕГЕНДА", "АУФФФФФ"][Math.floor(Math.random()*5)];
  state.lastEarned = newAch; state.summaryReturn = "HOME"; state.screen = "SUMMARY";
  save(); render();
};

// === CLOUD BACKUP (GitHub Gist) ===
const CLOUD = {
  token: () => localStorage.getItem('gymlog_cloud_token') || '',
  gistId: () => localStorage.getItem('gymlog_cloud_gist') || '',
  FILE: 'gymlog-backup.json',
  snapshot() {
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k === 'gymlog_cloud_token') continue;
      data[k] = localStorage.getItem(k);
    }
    return JSON.stringify({ app: 'gymlog', v: 1, ts: Date.now(), data });
  },
  async api(path, opts = {}) {
    const r = await fetch('https://api.github.com' + path, {
      ...opts,
      headers: {
        'Accept': 'application/vnd.github+json',
        'Authorization': 'Bearer ' + this.token(),
        'Content-Type': 'application/json',
        ...(opts.headers || {})
      }
    });
    if (!r.ok) throw new Error('GitHub ' + r.status);
    return r.json();
  },
  async backup(silent = true) {
    if (!this.token()) return false;
    const body = JSON.stringify({ files: { [this.FILE]: { content: this.snapshot() } } });
    let gist = null;
    if (this.gistId()) {
      try { gist = await this.api('/gists/' + this.gistId(), { method: 'PATCH', body }); }
      catch (e) { gist = null; }
    }
    if (!gist) {
      gist = await this.api('/gists', { method: 'POST', body: JSON.stringify({ description: 'gymlog cloud backup', public: false, files: { [this.FILE]: { content: this.snapshot() } } }) });
      localStorage.setItem('gymlog_cloud_gist', gist.id);
    }
    localStorage.setItem('gymlog_cloud_last', String(Date.now()));
    if (!silent) toast('Бэкап сохранён ☁️');
    return true;
  },
  async findGist() {
    const list = await this.api('/gists?per_page=100');
    const g = list.find(x => (x.description || '').includes('gymlog cloud backup') || (x.files && x.files[this.FILE]));
    return g ? g.id : '';
  },
    async listBackups() {
    const list = await this.api('/gists?per_page=100');
    const cands = list.filter(x => (x.files && x.files[this.FILE]) || (x.description || '').includes('gymlog cloud backup'));
    const out = [];
    for (const g of cands) {
      const f = g.files && g.files[this.FILE];
      if (!f) continue;
      let hist = 0, size = f.size || 0;
      try {
        const content = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
        const parsed = JSON.parse(content);
        const h = parsed.data && parsed.data.history;
        hist = h ? JSON.parse(h).length : 0;
      } catch (e) {}
      out.push({ id: g.id, updated: g.updated_at, size, hist });
    }
    out.sort((a, b) => (b.hist - a.hist) || (b.size - a.size));
    return out;
  },
  async restore() {
    const all = await this.listBackups();
    const id = all.length ? all[0].id : this.gistId();
    if (!id) throw new Error('Бэкап не найден');
    const g = await this.api('/gists/' + id);
    const f = g.files[this.FILE];
    if (!f) throw new Error('Файл бэкапа не найден');
    const raw = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    const parsed = JSON.parse(raw);
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    keys.forEach(k => { if (!k.startsWith('gymlog_cloud')) localStorage.removeItem(k); });
    Object.entries(parsed.data || {}).forEach(([k, v]) => localStorage.setItem(k, v));
    localStorage.setItem('gymlog_cloud_gist', id);
    return parsed;
  }
};

let cloudTimer = null, cloudDeb = null;
function cloudQueue() {
  if (!CLOUD.token()) return;
  clearTimeout(cloudDeb);
  cloudDeb = setTimeout(() => CLOUD.backup(true).catch(() => {}), 30000);
}
function cloudStart() {
  if (cloudTimer) clearInterval(cloudTimer);
  cloudTimer = setInterval(() => CLOUD.backup(true).catch(() => {}), 10 * 60 * 1000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') CLOUD.backup(true).catch(() => {});
  });
}
window.cloudBackupNow = () => CLOUD.backup(false).then(() => render()).catch(e => toast(e.message));
window.cloudRestore = () => CLOUD.restore().then(() => { toast('Восстановлено!'); location.reload(); }).catch(e => toast(e.message));
window.cloudConnect = async () => {
  const tok = document.getElementById('cloudToken').value.trim();
  if (!tok) { toast('Вставь токен'); return; }
  localStorage.setItem('gymlog_cloud_token', tok);
  try {
    const all = await CLOUD.listBackups();
    if (all.length && all[0].hist > 0) {
      localStorage.setItem('gymlog_cloud_gist', all[0].id);
      toast('Нашёл старый бэкап. Жми «Восстановить из облака»');
    } else {
      await CLOUD.backup(false);
      cloudStart();
    }
  } catch (e) { toast(e.message); }
  render();
};

    const hiddenLocked = d.hidden && !has;
    const rClass = d.rarity===0?'bronze':d.rarity===1?'silver':d.rarity===2?'gold':'platinum';
    let prog = '';
    if (!has && d.progress && !hiddenLocked) {
      const [cur, target] = d.progress(state.history, bw);
      const frac = target > 0 ? Math.max(0.02, Math.min(1, cur/target)) : 0.02;
      prog = `<div class="ach-prog"><i style="width:${(frac*100).toFixed(0)}%"></i></div><div class="ach-prog-lbl">${cur} / ${target}</div>`;
    }
    return `
      <div class="card ach r${d.rarity} ${has?'got':'locked-c'}">
        <div class="medal ${has?'earned '+rClass:'locked'}">${has ? d.icon : (hiddenLocked ? '?' : d.icon)}</div>

          ${prog}
        </div>

  };
  const secs = [0,1,2,3].map(r => {
    const list = ACHIEVEMENTS.filter(a => a.rarity === r);
    return `<div class="ach-sec">${['Бронзовый ярус','Серебряный ярус','Золотой ярус','Платиновый ярус'][r]}</div>` + list.map(card).join('');

const drawChart = () => {
  const canvas = document.getElementById("chart");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = 240 * devicePixelRatio;
  const ctx = canvas.getContext("2d");
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const w = rect.width, h = 240, pad = 30;
  const dataPoints = state.history.flatMap(wk => wk.exercises.filter(e => e.name === state.selectedExercise).flatMap(e => e.lines.map(l => [wk.start, l.weight]))).sort((a,b) => a[0]-b[0]);
  if (dataPoints.length < 2) return;
  const minX = dataPoints[0][0], maxX = dataPoints[dataPoints.length-1][0];
  const minY = Math.min(...dataPoints.map(p => p[1])), maxY = Math.max(...dataPoints.map(p => p[1]));
  const rangeY = maxY === minY ? 10 : maxY - minY;
  ctx.strokeStyle = "#2a2a2a"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, h-pad); ctx.lineTo(w-pad, h-pad); ctx.stroke();
  ctx.strokeStyle = "#4a6bff"; ctx.lineWidth = 2; ctx.beginPath();
  dataPoints.forEach((p, i) => {
    const x = pad + ((p[0]-minX)/(maxX-minX||1)) * (w-2*pad);
    const y = h - pad - ((p[1]-minY)/rangeY) * (h-2*pad);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  ctx.fillStyle = "#4a6bff";
  dataPoints.forEach(p => {
    const x = pad + ((p[0]-minX)/(maxX-minX||1)) * (w-2*pad);
    const y = h - pad - ((p[1]-minY)/rangeY) * (h-2*pad);
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
  });
};

      <button class="btn-small btn-primary" onclick="cloudConnect()">Подключить и забэкапить</button>

  <div class="card" style="cursor:default"><div class="switch-row"><div>Автозапуск после подхода</div><div class="switch ${state.autoStart?'on':''}" onclick="state.autoStart=!state.autoStart;save();render()"></div></div></div>
  <div class="card" style="cursor:default"><h3>Пресет отдыха (сек)</h3><div class="radio-group">${[60,90,120,180].map(p => `<div class="radio ${state.presetSeconds===p?'active':''}" onclick="state.presetSeconds=${p};if(state.timerMode==='COUNTDOWN'&&!state.timerRunning)state.timerAnchorMs=${p}*1000;save();render()">${p}</div>`).join("")}</div></div>
`;
};

const renderDialog = () => {
  const d = state.dialog;
  if (!d) return;
  let content = "";
  if (d.type === "confirm") {
    content = `<div class="dialog"><h3>${d.title}</h3><div style="margin-bottom:16px">${d.text}</div><div class="btn-row"><button class="btn-danger" onclick="dialogConfirm()">${d.ok}</button><button onclick="dialogCancel()">Отмена</button></div></div>`;
   } else if (d.type === "start") {
    content = `<div class="dialog"><h3>Начать тренировку</h3><div style="margin-bottom:16px">Выбери вариант:</div><div class="btn-row"><button class="btn-primary" onclick="window.startCleanWorkout()">Чистый шаблон</button><button onclick="window.showHistoryCopyDialog()">Из истории</button></div></div>`;                                                                                                                                        
  } else if (d.type === "copy") {
    content = `<div class="dialog"><h3>Выбери тренировку</h3><div style="max-height:300px;overflow-y:auto;margin-bottom:12px">${state.history.length === 0 ? '<div class="empty">История пуста</div>' : state.history.map((sw, i) => `<div class="card" onclick="pickFromHistory(${i})"><div style="font-size:14px">${fmtDateTime(sw.start)}</div><div class="meta">${setsOf(sw)} подходов · ${sw.exercises.length} упр.</div></div>`).join("")}</div><button onclick="dialogCancel()">Отмена</button></div>`;
  } else if (d.type === "draftName" || d.type === "renameDraft") {
    content = `<div class="dialog"><h3>${d.type === "renameDraft" ? "Переименовать тренировку" : "Имя черновика"}</h3><input id="dlg-input" type="text" value="${d.initial}"><div class="btn-row"><button class="btn-primary" onclick="saveDraftName()">Сохранить</button><button onclick="dialogCancel()">Отмена</button></div></div>`;
  } else if (d.type === "unsaved") {
    content = `<div class="dialog"><h3>Не сохранено</h3><div style="margin-bottom:16px">Этот черновик ещё не сохранён. Сохранить его в будущие тренировки?</div><div class="btn-row"><button class="btn-primary" onclick="unsavedSave()">Сохранить</button><button onclick="unsavedDiscard()">Не сохранять</button></div></div>`;
  } else if (d.type === "saveDraftChoice") {
    content = `<div class="dialog"><h3>Сохранить изменения</h3><div style="margin-bottom:16px">Что сделать с изменениями?</div><div class="btn-row" style="flex-direction:column"><button class="btn-primary" onclick="saveDraftToExisting()">Сохранить в этот черновик</button><button class="btn-secondary" onclick="saveDraftAsNew()">Создать новый черновик</button><button onclick="discardDraftChanges()">Отменить изменения</button></div></div>`;
  } else if (d.type === "pickExercise") {
    content = `<div class="dialog"><h3>Выбрать упражнение</h3><div style="max-height:300px;overflow-y:auto;margin-bottom:12px">${state.exerciseBase.length === 0 ? '<div class="empty">База пуста. Наполни её в Настройках.</div>' : state.exerciseBase.map((n, i) => `<div class="card" onclick="pickExerciseByIndex(${i})"><div style="padding:8px">${n}</div></div>`).join("")}</div><div class="btn-row"><button class="btn-primary" onclick="state.dialog={type:'addExercise'};render()">Добавить своё</button><button onclick="dialogCancel()">Отмена</button></div></div>`;
  } else if (d.type === "addExercise" || d.type === "editExercise") {
    content = `<div class="dialog"><h3>${d.type === "addExercise" ? "Новое упражнение" : "Упражнение"}</h3><input id="dlg-input" type="text" value="${d.name || ""}"><div class="btn-row"><button class="btn-primary" onclick="saveExName()">Сохранить</button>${d.type === "editExercise" ? `<button class="btn-danger" onclick="deleteEx()">Удалить</button>` : `<button onclick="dialogCancel()">Отмена</button>`}</div></div>`;
  } else if (d.type === "editLine") {
    content = `<div class="dialog"><h3>Строка веса</h3><input id="dlg-w" type="text" inputmode="decimal" value="${d.weight}" placeholder="Вес, кг"><input id="dlg-r" type="text" inputmode="numeric" value="${d.reps}" placeholder="Повторения"><input id="dlg-s" type="text" inputmode="numeric" value="${d.sets}" placeholder="Сколько подходов"><div class="btn-row"><button class="btn-primary" onclick="saveLineData()">Сохранить</button><button class="btn-danger" onclick="deleteLineData()">Удалить</button></div></div>`;
  } else if (d.type === "note") {
    content = `<div class="dialog"><h3>Заметка к подходу</h3><textarea id="dlg-input">${d.note}</textarea><div class="btn-row"><button class="btn-primary" onclick="saveNoteData()">Сохранить</button><button onclick="dialogCancel()">Отмена</button></div></div>`;
  }
  if (content) {
    const bg = document.createElement("div");
    bg.className = "dialog-bg";
    bg.innerHTML = content;
    bg.onclick = (e) => { if (e.target === bg) { state.dialog = null; render(); } };
    document.body.appendChild(bg);
    const inp = document.getElementById("dlg-input");
    if (inp) { setTimeout(() => { inp.focus(); inp.select(); }, 50); }
  }
};

window.toggleExpand = (ei) => {
  if (state.expandedExercises.has(ei)) state.expandedExercises.delete(ei);
  else state.expandedExercises.add(ei);
  render();
};

// === RIPPLE: белая волна от точки нажатия ===
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest ? e.target.closest('button') : null;
  if (!b) return;
  const r = b.getBoundingClientRect();
  const d = Math.max(r.width, r.height);
  const s = document.createElement('span');
  s.className = 'ripple';
  s.style.width = s.style.height = d + 'px';
  s.style.left = (e.clientX - r.left - d/2) + 'px';
  s.style.top = (e.clientY - r.top - d/2) + 'px';
  b.appendChild(s);
  setTimeout(() => s.remove(), 600);
});

// === iframe-модули: точная высота под шапкой ===
let iframeFix = null;
function fixIframe(sc, hdr){
  const ifr = sc.querySelector('iframe');
  if (!ifr) return;
  const set = () => {
    const inner = sc.querySelector('.inner');
    const cs = inner ? getComputedStyle(inner) : null;
    const pt = cs ? (parseFloat(cs.paddingTop) || 0) : 0;
    const pb = cs ? (parseFloat(cs.paddingBottom) || 0) : 0;
    ifr.style.height = Math.max(200, sc.clientHeight - (hdr ? hdr.offsetHeight : 0) - pt - pb) + 'px';
  };
  set();
  iframeFix = set;
}
window.addEventListener('resize', () => { if (iframeFix) iframeFix(); });

const ORDER = {HOME:0,BRIEFING:1,FUTURE:2,WORKOUT:3,SUMMARY:4,HISTORY:5,STATS:6,ACHIEVEMENTS:7,WATER:8,RPG:9,WRAPPED:10,SETTINGS:11,BASE:12};
const app = document.getElementById("app");
let lastScreen = null;
const render = () => {
  document.querySelectorAll('.dialog-bg').forEach(d => d.remove());
  const oldContent = document.querySelector('.app-content');
  const oldScroll = oldContent ? oldContent.scrollTop : 0;
  const changed = lastScreen !== state.screen && lastScreen !== null;
  const dirBack = changed && (ORDER[state.screen] !== undefined ? ORDER[state.screen] : 99) < (ORDER[lastScreen] !== undefined ? ORDER[lastScreen] : 99);
  const contentFns = {
    HOME: renderHome, FUTURE: renderFuture, WORKOUT: renderWorkout, HISTORY: renderHistory,
    STATS: renderStats, SETTINGS: renderSettings, BASE: renderBase, ACHIEVEMENTS: renderAchievements,
    SUMMARY: renderSummary, WATER: renderWater, RPG: renderRPG, WRAPPED: renderWrapped, BRIEFING: renderBriefing
  };
  const noPad = (state.screen==='WATER'||state.screen==='RPG'||state.screen==='WRAPPED'||state.screen==='BRIEFING');
  app.innerHTML = `<div class="app-content${noPad?' no-pad':''}"><div class="screen${changed?(dirBack?' anim-back':' anim-fwd'):''}"><div class="app-header"${state.screen==='WATER'?' style="background:rgba(10,10,10,.35)"':''}>${headerFor()}</div><div class="inner">${contentFns[state.screen]()}</div></div></div>`;
  const newContent = document.querySelector('.app-content');
  const hdr = newContent ? newContent.querySelector('.app-header') : null;
  const scr = newContent ? newContent.querySelector('.screen') : null;
  if (scr && changed) {
    scr.addEventListener('animationend', () => scr.classList.remove('anim-fwd','anim-back'), {once:true});
  }
  if (newContent) {
    newContent.scrollTop = changed ? 0 : oldScroll;
    if (noPad) fixIframe(newContent, hdr);
  }
  lastScreen = state.screen;
  if (state.dialog) renderDialog();
  if (state.screen === "STATS") setTimeout(drawChart, 50);
  if (state.screen === "WORKOUT" && !state.editorMode) setTimeout(updateTimerUI, 10);
};

if (state.timerMode === "COUNTDOWN") state.timerAnchorMs = state.presetSeconds * 1000;
render();
cloudStart();
// Фикс для inline-кнопок диалога "Новая тренировка"
window.startCleanWorkout = () => { state.dialog = null; enterEditor([], -1); };
window.showHistoryCopyDialog = () => { state.dialog = { type: 'copy' }; render(); };
</script>
